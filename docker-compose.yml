services:
  postgres:
    image: postgres:16
    container_name: ilovelawyer-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ilovelawyer_api
    ports:
      - "5432:5432"
    volumes:
      - ilovelawyer-api_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ilovelawyer-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  ilovelawyer-api_postgres_data:
