services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ilovelawyer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: legalrag
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ilovelawyer-redis
    command: redis-server --requirepass password
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: always

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ilovelawyer-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379:0:password
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    restart: always

  # Per-developer SQS emulator — each developer runs their own instance of this, so there is no
  # shared AWS resource in dev at all: a message sent by this machine's API can only ever be
  # received by this same machine's workers (see src/lib/sqs.ts's AWS_SQS_ENDPOINT override).
  localstack:
    image: localstack/localstack:3
    container_name: ilovelawyer-localstack
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=${AWS_REGION:-ap-southeast-1}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack-init/ready-create-queues.sh:/etc/localstack/init/ready.d/create-queues.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  # One-shot: creates the 9 app queues in LocalStack once it's healthy. create-queue is
  # idempotent (returns the existing queue if one already exists by that name), so re-running
  # this on every `docker compose up` is safe — it's not a long-running service.
  sqs-init:
    image: amazon/aws-cli:2.15.30
    container_name: ilovelawyer-sqs-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
    entrypoint: ["/bin/sh", "/init/create-queues.sh"]
    volumes:
      - ./docker/localstack-init:/init:ro
    restart: "no"

  # Per-developer S3 emulator — each developer runs their own instance, so there's no shared
  # AWS resource in dev (see src/utils/s3.ts's AWS_S3_ENDPOINT override). Console at :9001
  # (minioadmin/minioadmin).
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ilovelawyer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: always

  # One-shot: creates the AWS_S3_BUCKET bucket and makes it anonymously downloadable, so local
  # presigned/proxy GETs behave like a real bucket without needing read credentials.
  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ilovelawyer-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb --ignore-existing local/${AWS_S3_BUCKET:-ilovelawyer-local} &&
      /usr/bin/mc anonymous set download local/${AWS_S3_BUCKET:-ilovelawyer-local}
      "
    restart: "no"

  # Forwards Stripe test-mode webhooks to the API running on this machine (npm run dev), so a
  # payment made locally settles the same way it does when deployed: the platform's events to
  # /api/webhooks/stripe, and lawyers' connected accounts' (payouts) to /api/webhooks/stripe-connect.
  # Opt-in: it only starts with `docker compose --profile stripe up stripe-cli`, and needs
  # STRIPE_SECRET_KEY (a sk_test_ key) in .env. --events lists every event the API handles; keep it
  # in step with docs/stripe-local-webhooks.md. See that page for the setup.
  stripe-cli:
    image: stripe/stripe-cli:v1.53.0
    container_name: ilovelawyer-stripe-cli
    profiles: ["stripe"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    # host.docker.internal is the host on Docker Desktop; the extra_hosts line makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - listen
      - --forward-to
      - http://host.docker.internal:${PORT:-3001}/api/webhooks/stripe
      - --forward-connect-to
      - http://host.docker.internal:${PORT:-3001}/api/webhooks/stripe-connect
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,refund.updated,refund.failed,payment_intent.succeeded,payment_intent.payment_failed,invoice.paid,invoice.payment_failed,customer.subscription.updated,customer.subscription.deleted,charge.dispute.created,charge.dispute.closed,transfer.reversed,account.updated,payout.paid,payout.failed
    restart: "no"

volumes:
  postgres_data:
  minio_data:
