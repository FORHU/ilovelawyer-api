name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: staging

concurrency:
  group: ilovelawyer-api-deploy-staging
  cancel-in-progress: true

env:
  ECR_REPOSITORY: ilovelawyer-api
  AWS_REGION: ap-southeast-1
  NODE_ENV: production
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build, Push & Deploy (staging)
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR auth token
        id: ecr-token
        run: |
          echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          ECR="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build \
            -t "$ECR:${{ env.IMAGE_TAG }}" \
            -t "$ECR:latest" \
            .
          docker push "$ECR:${{ env.IMAGE_TAG }}"
          docker push "$ECR:latest"

      - name: Write env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MAILER_TRANSPORT_HOST: ${{ secrets.MAILER_TRANSPORT_HOST }}
          MAILER_TRANSPORT_PORT: ${{ secrets.MAILER_TRANSPORT_PORT }}
          MAILER_TRANSPORT_SECURE: ${{ secrets.MAILER_TRANSPORT_SECURE }}
          MAILER_EMAIL: ${{ secrets.MAILER_EMAIL }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ secrets.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRY_DAYS }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CHAT_WONDER_API_URL: ${{ secrets.CHAT_WONDER_API_URL }}
          CHAT_WONDER_WS_URL: ${{ secrets.CHAT_WONDER_WS_URL }}
        run: |
          cat > ${{ github.workspace }}/ilovelawyer-api.env << EOF
          DATABASE_URL=${DATABASE_URL}
          SECRET_KEY=${SECRET_KEY}
          MAILER_TRANSPORT_HOST=${MAILER_TRANSPORT_HOST}
          MAILER_TRANSPORT_PORT=${MAILER_TRANSPORT_PORT}
          MAILER_TRANSPORT_SECURE=${MAILER_TRANSPORT_SECURE}
          MAILER_EMAIL=${MAILER_EMAIL}
          MAILER_PASSWORD=${MAILER_PASSWORD}
          ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
          REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
          ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
          REFRESH_TOKEN_EXPIRY_DAYS=${REFRESH_TOKEN_EXPIRY_DAYS}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          SERVICE_ACCOUNT=${SERVICE_ACCOUNT}
          CLIENT_URL=${CLIENT_URL}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          CHAT_WONDER_API_URL=${CHAT_WONDER_API_URL}
          CHAT_WONDER_WS_URL=${CHAT_WONDER_WS_URL}
          NODE_ENV=${{ env.NODE_ENV }}
          PORT=3001
          EOF

      - name: Copy env file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ilovelawyer-api.env
          target: /home/ec2-user/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DEPLOY_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: ECR_PASSWORD,ECR_REGISTRY,DEPLOY_IMAGE_TAG
          script: |
            set -e
            chmod 600 /home/ec2-user/ilovelawyer-api.env
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/ilovelawyer-api:$DEPLOY_IMAGE_TAG"

            docker run --rm \
              --entrypoint npx \
              -v /home/ec2-user/ilovelawyer-api.env:/app/.env:ro \
              "$ECR_REGISTRY/ilovelawyer-api:$DEPLOY_IMAGE_TAG" \
              prisma migrate deploy

            docker stop ilovelawyer-api 2>/dev/null || true
            docker rm   ilovelawyer-api 2>/dev/null || true
            docker run -d --name ilovelawyer-api --restart unless-stopped \
              --env-file /home/ec2-user/ilovelawyer-api.env \
              -p 3001:3001 \
              "$ECR_REGISTRY/ilovelawyer-api:$DEPLOY_IMAGE_TAG"
            docker image prune -f
