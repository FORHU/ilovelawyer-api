name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: main

concurrency:
  group: ilovelawyer-api-deploy-production
  cancel-in-progress: true

env:
  ECR_REPOSITORY: ilovelawyer-api
  AWS_REGION: ap-southeast-1
  NODE_ENV: production
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build, Push & Deploy (production)
    # Native arm64 — matches Graviton EC2. Do not build linux/arm64 via QEMU on
    # ubuntu-latest; npm/prisma under emulation looks stuck and can take hours.
    runs-on: ubuntu-24.04-arm
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR auth token
        id: ecr-token
        run: |
          echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Write env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MAILER_TRANSPORT_HOST: ${{ secrets.MAILER_TRANSPORT_HOST }}
          MAILER_TRANSPORT_PORT: ${{ vars.MAILER_TRANSPORT_PORT }}
          MAILER_TRANSPORT_SECURE: ${{ vars.MAILER_TRANSPORT_SECURE }}
          MAILER_EMAIL: ${{ secrets.MAILER_EMAIL }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ vars.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY_DAYS: ${{ vars.REFRESH_TOKEN_EXPIRY_DAYS }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CHAT_WONDER_API_URL: ${{ vars.CHAT_WONDER_API_URL }}
          CHAT_WONDER_WS_URL: ${{ vars.CHAT_WONDER_WS_URL }}
          CHAT_WONDER_API_KEY: ${{ secrets.CHAT_WONDER_API_KEY }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          CLOUDFRONT_URL: ${{ vars.CLOUDFRONT_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > ${{ github.workspace }}/ilovelawyer-api.env << EOF
          DATABASE_URL=${DATABASE_URL}
          SECRET_KEY=${SECRET_KEY}
          MAILER_TRANSPORT_HOST=${MAILER_TRANSPORT_HOST}
          MAILER_TRANSPORT_PORT=${MAILER_TRANSPORT_PORT}
          MAILER_TRANSPORT_SECURE=${MAILER_TRANSPORT_SECURE}
          MAILER_EMAIL=${MAILER_EMAIL}
          MAILER_PASSWORD=${MAILER_PASSWORD}
          ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
          REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
          ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
          REFRESH_TOKEN_EXPIRY_DAYS=${REFRESH_TOKEN_EXPIRY_DAYS}
          REDIS_URL=${REDIS_URL}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          SERVICE_ACCOUNT=${SERVICE_ACCOUNT}
          CLIENT_URL=${CLIENT_URL}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          CHAT_WONDER_API_URL=${CHAT_WONDER_API_URL}
          CHAT_WONDER_WS_URL=${CHAT_WONDER_WS_URL}
          CHAT_WONDER_API_KEY=${CHAT_WONDER_API_KEY}
          AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_S3_BUCKET=${AWS_S3_BUCKET}
          AWS_REGION=${{ env.AWS_REGION }}
          CLOUDFRONT_URL=${CLOUDFRONT_URL}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          NODE_ENV=${{ env.NODE_ENV }}
          PORT=3001
          EOF

      - name: Copy env file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ilovelawyer-api.env
          target: /home/ec2-user/

      - name: Copy Caddyfile to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/Caddyfile
          target: /home/ec2-user/
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DEPLOY_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: ECR_PASSWORD,ECR_REGISTRY,DEPLOY_IMAGE_TAG
          script: |
            set -e
            chmod 600 /home/ec2-user/ilovelawyer-api.env
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull --platform linux/arm64 "$ECR_REGISTRY/ilovelawyer-api:$DEPLOY_IMAGE_TAG"

            docker run --rm \
              --platform linux/arm64 \
              --network host \
              --entrypoint npx \
              -v /home/ec2-user/ilovelawyer-api.env:/app/.env:ro \
              "$ECR_REGISTRY/ilovelawyer-api:$DEPLOY_IMAGE_TAG" \
              prisma migrate deploy

            docker stop ilovelawyer-api 2>/dev/null || true
            docker rm   ilovelawyer-api 2>/dev/null || true
            docker run -d --name ilovelawyer-api --restart unless-stopped \
              --platform linux/arm64 \
              --env-file /home/ec2-user/ilovelawyer-api.env \
              -p 127.0.0.1:3001:3001 \
              "$ECR_REGISTRY/ilovelawyer-api:$DEPLOY_IMAGE_TAG"

            docker pull --platform linux/arm64 caddy:2
            if docker inspect caddy >/dev/null 2>&1; then
              docker start caddy
              docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            else
              docker run -d --name caddy --restart unless-stopped \
                --network host \
                --platform linux/arm64 \
                -v /home/ec2-user/Caddyfile:/etc/caddy/Caddyfile:ro \
                -v caddy_data:/data \
                -v caddy_config:/config \
                caddy:2
            fi
            docker image prune -f
